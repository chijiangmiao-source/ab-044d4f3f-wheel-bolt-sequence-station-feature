name: hub-review

services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: hub
      POSTGRES_PASSWORD: hub
      POSTGRES_DB: hub_review
    volumes:
      - db_data:/var/lib/postgresql/data
      - ./db/init.sql:/docker-entrypoint-initdb.d/01-init.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U hub -d hub_review"]
      interval: 2s
      timeout: 3s
      retries: 30
    restart: unless-stopped

  api:
    build: ./api
    environment:
      DATABASE_URL: postgres://hub:hub@db:5432/hub_review
      PORT: "3000"
    ports:
      - "${API_PORT:-3000}:3000"
    depends_on:
      db:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:3000/healthz').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 3s
      timeout: 5s
      retries: 20
    restart: unless-stopped

  web:
    build: ./web
    ports:
      - "${WEB_PORT:-8080}:80"
    depends_on:
      api:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1/"]
      interval: 5s
      timeout: 3s
      retries: 10
    restart: unless-stopped

  # 一次性验收服务：跑完协议与页面用例后退出，退出码即验收结果
  verify:
    build: ./verify
    environment:
      API_BASE: http://api:3000
      WEB_BASE: http://web
      DATABASE_URL: postgres://hub:hub@db:5432/hub_review
    depends_on:
      api:
        condition: service_healthy
      web:
        condition: service_healthy
    restart: "no"

volumes:
  db_data:
